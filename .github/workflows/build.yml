name: Build Dataset Catalog

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate
        run: python scripts/validate.py

      - name: Generate Markdown catalogs
        run: python scripts/build.py

      - name: Generate Excel export
        run: python scripts/generate_excel.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ statistics/ exports/
          git diff --cached --quiet || git commit -m "chore: update generated dataset catalogs"
          git push
